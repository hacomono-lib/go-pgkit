name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Run tests
      run: docker compose run --rm test

    - name: Clean up
      if: always()
      run: docker compose down -v

  fmt:
    name: Format Check
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Run gofumpt
      run: docker compose run --rm fmt

    - name: Check for changes
      run: |
        if [ -n "$(git diff --name-only)" ]; then
          echo "The following files are not formatted:"
          git diff --name-only
          exit 1
        fi

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v6

    - name: Run lint
      run: docker compose run --rm lint

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6

    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: 1.25.x

    - name: Cache Go modules and build cache
      uses: actions/cache@v5
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: ${{ runner.os }}-go-1.25.x-${{ hashFiles('**/go.sum') }}
        restore-keys: |
          ${{ runner.os }}-go-1.25.x-
          ${{ runner.os }}-go-

    - name: Set Go environment variables
      run: |
        echo "GOCACHE=$HOME/.cache/go-build" >> $GITHUB_ENV
        echo "GOMODCACHE=$HOME/go/pkg/mod" >> $GITHUB_ENV
        echo "GOBIN=$HOME/go/bin" >> $GITHUB_ENV

    - name: Cache Gosec binary
      uses: actions/cache@v5
      with:
        path: ~/go/bin
        key: ${{ runner.os }}-gosec-v2.18.2

    - name: Install Gosec
      run: |
        if [ ! -f "$HOME/go/bin/gosec" ]; then
          go install github.com/securego/gosec/v2/cmd/gosec@v2.18.2
        fi

    - name: Run Gosec Security Scanner
      run: |
        $HOME/go/bin/gosec -no-fail -fmt sarif -out results.sarif ./...
      continue-on-error: true

    - name: Display Security Results
      run: |
        if [ -f results.sarif ]; then
          echo "Security scan completed. Results saved to results.sarif"
          jq -r '.runs[0].results[] | "Issue: " + .ruleId + " - " + .message.text' results.sarif 2>/dev/null || echo "No security issues found"
        fi
      if: always()
